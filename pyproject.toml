[project]
name = "synapse-ai"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]==0.141.1",
    "pydantic>=2.12,<3",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.22",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "structlog>=25,<27",
    "pypdfium2>=5.13.0",
    "pytesseract>=0.3.13",
    "opentelemetry-api>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.15", "mypy>=1.19"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[[tool.mypy.overrides]]
module = ["pypdfium2.*", "pytesseract.*"]
ignore_missing_imports = true
